name: CI

on:
  push:
    branches: [master, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install clang-format
        run: pipx install clang-format==21.1.8
      - name: Check formatting
        run: clang-format --version && clang-format --dry-run --Werror --style=file $(git ls-files '*.cpp' '*.hpp' '*.h')

  build-and-test:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC Debug / Ubuntu
            os: ubuntu-latest
            configure_preset: gcc-debug
            build_preset: build-gcc-debug
            test_preset: test-gcc-debug
          - name: GCC Release / Ubuntu
            os: ubuntu-latest
            configure_preset: gcc-release
            build_preset: build-gcc-release
            test_preset: test-gcc-release
          - name: Clang Debug / Ubuntu
            os: ubuntu-latest
            configure_preset: clang-debug
            build_preset: build-clang-debug
            test_preset: test-clang-debug
          - name: Clang Release / Ubuntu
            os: ubuntu-latest
            configure_preset: clang-release
            build_preset: build-clang-release
            test_preset: test-clang-release
          - name: Clang-Tidy / Ubuntu
            os: ubuntu-latest
            configure_preset: clang-tidy
            build_preset: build-clang-tidy
            test_preset: test-clang-tidy
          - name: GCC ASan + UBSan / Ubuntu
            os: ubuntu-latest
            configure_preset: gcc-asan-ubsan
            build_preset: build-gcc-asan-ubsan
            test_preset: test-gcc-asan-ubsan
          - name: Clang TSan / Ubuntu
            os: ubuntu-latest
            configure_preset: clang-tsan
            build_preset: build-clang-tsan
            test_preset: test-clang-tsan
          - name: Apple Clang Debug / macOS
            os: macos-latest
            configure_preset: clang-debug
            build_preset: build-clang-debug
            test_preset: test-clang-debug
          - name: Apple Clang Release / macOS
            os: macos-latest
            configure_preset: clang-release
            build_preset: build-clang-release
            test_preset: test-clang-release
          - name: Apple Clang ASan + UBSan / macOS
            os: macos-latest
            configure_preset: clang-asan-ubsan
            build_preset: build-clang-asan-ubsan
            test_preset: test-clang-asan-ubsan
          - name: MSVC Debug / Windows
            os: windows-latest
            configure_preset: msvc-debug
            build_preset: build-msvc-debug
            test_preset: test-msvc-debug
          - name: MSVC Release / Windows
            os: windows-latest
            configure_preset: msvc-release
            build_preset: build-msvc-release
            test_preset: test-msvc-release
          - name: MSVC ASan / Windows
            os: windows-latest
            configure_preset: msvc-asan
            build_preset: build-msvc-asan
            test_preset: test-msvc-asan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install system dependencies for GLFW and the Vulkan loader
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxinerama-dev libxcursor-dev xorg-dev libglu1-mesa-dev pkg-config \
            libwayland-dev libxkbcommon-dev wayland-protocols extra-cmake-modules
      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ github.workspace }}/.deps/vcpkg'
          vcpkgGitCommitId: d015e31e90838a4c9dfa3eed45979bc70d9357fc
      - name: Restore vcpkg binary cache
        uses: actions/cache@v6
        with:
          path: |
            .deps/binary-cache
            .deps/downloads
          key: vcpkg-${{ runner.os }}-${{ matrix.configure_preset }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ matrix.configure_preset }}-
            vcpkg-${{ runner.os }}-
      - name: Create vcpkg cache directories
        run: cmake -E make_directory .deps/downloads .deps/binary-cache
      - name: Configure
        run: cmake --preset ${{ matrix.configure_preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.build_preset }} --parallel
      - name: Test
        run: ctest --preset ${{ matrix.test_preset }}
